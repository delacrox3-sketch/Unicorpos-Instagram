name: Post diário UNICORPOS

on:
  schedule:
    # 12:07 UTC = 09:07 em Brasília (UTC-3 o ano todo, sem horário de verão).
    # De segunda a sexta. Feriados são filtrados dentro do publicar.py.
    # O publicar.py ainda espera de 0 a 90 min antes de postar, então o horário
    # real cai entre 09:07 e 10:37 e muda todo dia. Isso é de propósito: o
    # portfólio já foi restringido por automação e horário cravado é assinatura
    # de máquina.
    - cron: "7 12 * * 1-5"
  workflow_dispatch:
    inputs:
      dia:
        description: "Forçar um dia do calendário (deixe vazio para usar a data de hoje)"
        required: false
      dry_run:
        description: "Só simular, sem publicar"
        type: boolean
        default: false
      sem_espera:
        description: "Publicar na hora, sem a espera aleatória (para recuperar um post atrasado)"
        type: boolean
        default: false

# Se dois disparos se cruzarem, o segundo espera. Evita post duplicado.
concurrency:
  group: post-diario
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # 90 min de espera aleatória + 10 de folga para a publicação em si.
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_LOCATION_ID: ${{ secrets.IG_LOCATION_ID }}
          BASE_URL_IMAGENS: ${{ vars.BASE_URL_IMAGENS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_DESTINO: ${{ vars.EMAIL_DESTINO }}
          # Só o disparo manual pode zerar a espera. O agendado mantém o jitter,
          # que é o que faz o horário variar como o de uma pessoa.
          JITTER_MAX_MIN: ${{ inputs.sem_espera && '0' || '90' }}
        run: |
          python3 publicar.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.dia && format('--dia {0}', inputs.dia) || '' }}
